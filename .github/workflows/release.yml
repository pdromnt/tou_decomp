name: Build release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag/version (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      source_ref: ${{ steps.source.outputs.source_ref }}
      tag_exists: ${{ steps.source.outputs.tag_exists }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release source
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "source_ref=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

  windows-x86:
    name: Windows x86
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Install 32-bit MinGW and CMake
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-cmake
            mingw-w64-i686-gcc
            mingw-w64-i686-ninja

      - name: Build and stage game
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          cmake --install build --prefix stage

      - name: Verify 32-bit executable
        shell: msys2 {0}
        run: objdump -f stage/TOU.exe | grep -q "file format pei-i386"

      - name: Package runtime
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          ./scripts/package-release.ps1
          -Version $env:RELEASE_TAG
          -Platform windows-x86
          -ExecutablePath stage/TOU.exe
          -LevelEditorDirectory stage/level-editor

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x86
          path: dist/*
          if-no-files-found: error

  native:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: windows-x64
            cmake_arch: x64
            executable: stage/TOU.exe
            expected_machine: "0x8664"
          - name: Windows ARM64
            runner: windows-11-arm
            platform: windows-arm64
            cmake_arch: ARM64
            executable: stage/TOU.exe
            expected_machine: "0xAA64"
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux-x64
            executable: stage/TOU
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            platform: linux-arm64
            executable: stage/TOU
          - name: macOS Intel
            runner: macos-15-intel
            platform: macos-x64
            executable: stage/TOU.app/Contents/MacOS/TOU
          - name: macOS Apple Silicon
            runner: macos-15
            platform: macos-arm64
            executable: stage/TOU.app/Contents/MacOS/TOU

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config build-essential \
            libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libudev-dev

      - name: Configure Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release

      - name: Configure Unix build
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build and stage game
        run: |
          cmake --build build --config Release --parallel 2
          cmake --install build --config Release --prefix stage

      - name: Verify Windows executable architecture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = Resolve-Path -LiteralPath stage/TOU.exe -ErrorAction Stop
          $stream = [System.IO.File]::OpenRead($executable)
          $reader = [System.IO.BinaryReader]::new($stream)
          try {
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset + 4
            $machine = $reader.ReadUInt16()
          } finally {
            $reader.Dispose()
            $stream.Dispose()
          }
          $expected = [Convert]::ToUInt16(
            '${{ matrix.expected_machine }}'.Substring(2), 16)
          if ($machine -ne $expected) {
            throw ('Wrong PE machine: expected 0x{0:X4}, found 0x{1:X4}' `
              -f $expected, $machine)
          }

      - name: Verify Unix executable architecture
        if: runner.os != 'Windows'
        shell: bash
        run: |
          executable="${{ matrix.executable }}"
          file "$executable"
          case "${{ matrix.platform }}" in
            linux-x64) file "$executable" | grep -q 'x86-64' ;;
            linux-arm64) file "$executable" | grep -Eq 'ARM aarch64|ARM64' ;;
            macos-x64) file "$executable" | grep -q 'x86_64' ;;
            macos-arm64) file "$executable" | grep -q 'arm64' ;;
          esac

      - name: Package runtime
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          ./scripts/package-release.ps1
          -Version $env:RELEASE_TAG
          -Platform ${{ matrix.platform }}
          -ExecutablePath ${{ matrix.executable }}
          -LevelEditorDirectory stage/level-editor

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, windows-x86, native]
    runs-on: ubuntu-24.04

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAG_EXISTS: ${{ needs.prepare.outputs.tag_exists }}
          SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
        run: |
          $archives = @(Get-ChildItem -LiteralPath release-assets -File |
            Where-Object { $_.Name -match '\.(zip|tar\.gz)$' } |
            Sort-Object Name |
            ForEach-Object { $_.FullName })
          if ($archives.Count -ne 7) {
            throw "Expected 7 release archives, found $($archives.Count)"
          }

          # A missing release is expected on the first run. PowerShell 7.4+
          # can otherwise promote that native non-zero exit into a terminating
          # error before the create branch is reached.
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:RELEASE_TAG *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            & gh release upload $env:RELEASE_TAG @archives --clobber
          } elseif ($env:TAG_EXISTS -eq "true") {
            & gh release create $env:RELEASE_TAG @archives --verify-tag --generate-notes
          } else {
            & gh release create $env:RELEASE_TAG @archives --target $env:SOURCE_REF --generate-notes
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publish failed with exit code $LASTEXITCODE"
          }
