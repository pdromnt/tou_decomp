name: Build release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag/version (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release source
        id: release_source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git check-ref-format "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }

          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -eq 0) {
            git checkout --detach "refs/tags/$env:RELEASE_TAG"
            "tag_exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "tag_exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Install 32-bit MinGW and CMake
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-cmake
            mingw-w64-i686-gcc
            mingw-w64-i686-ninja

      - name: Build game
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: Package runtime files
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $archive = & ./scripts/package-release.ps1 -Version $env:RELEASE_TAG
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: tunnels-of-underworld-windows
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAG_EXISTS: ${{ steps.release_source.outputs.tag_exists }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:ARCHIVE --clobber
          } elseif ($env:TAG_EXISTS -eq "true") {
            gh release create $env:RELEASE_TAG $env:ARCHIVE --verify-tag --generate-notes
          } else {
            gh release create $env:RELEASE_TAG $env:ARCHIVE --target $env:GITHUB_SHA --generate-notes
          }
