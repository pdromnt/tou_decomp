name: Build release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag/version (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            make
            mingw-w64-i686-gcc

      - name: Build game
        shell: msys2 {0}
        run: make -j2

      - name: Package runtime files
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $archive = & ./scripts/package-release.ps1 -Version $env:RELEASE_TAG
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunnels-of-underworld-windows
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release create $env:RELEASE_TAG "${{ steps.package.outputs.archive }}" --target $env:GITHUB_SHA --generate-notes
