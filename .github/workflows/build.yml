name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install 32-bit MinGW and CMake
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-binutils
            mingw-w64-i686-cmake
            mingw-w64-i686-gcc
            mingw-w64-i686-ninja

      - name: Build game
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: Verify 32-bit executable
        shell: msys2 {0}
        run: objdump -f TOU.exe | grep -q "file format pei-i386"
